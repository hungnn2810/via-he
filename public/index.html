<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xóm Trọ Sinh Viên</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --gold: #ffd76a; --card: rgba(12, 16, 34, 0.82); --line: rgba(255, 215, 106, 0.55); }
  html, body { margin: 0; height: 100%; background: #070a18; overflow: hidden; }
  #stage { position: absolute; left: 50%; top: 50%; width: 1080px; height: 1920px; transform-origin: center;
    font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #fff; }
  #gl { position: absolute; inset: 0; width: 1080px; height: 1920px; display: block; }
  #ui { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .shadow { text-shadow: 0 2px 0 rgba(0,0,0,.6), 0 0 14px rgba(0,0,0,.55); }

  /* Tiêu đề */
  #head { position: absolute; top: 150px; left: 0; right: 0; text-align: center; z-index: 30; } /* luôn nằm trên tên phòng, bong bóng */
  #labels { position: absolute; inset: 0; z-index: 10; }
  #title { font-size: 66px; font-weight: 900; letter-spacing: 1px; color: var(--gold);
    -webkit-text-stroke: 3px #4a1a05; paint-order: stroke fill; text-shadow: 0 6px 0 #4a1a05, 0 0 30px rgba(255,180,60,.45); }
  #hint { display: inline-flex; gap: 14px; margin-top: 10px; padding: 10px 22px; border-radius: 999px;
    background: var(--card); border: 2px solid var(--line); font-size: 25px; font-weight: 700; }
  #hint b { color: var(--gold); font-weight: 900; }
  #noodles { margin-top: 10px; font-size: 24px; font-weight: 800; }
  #shops { margin-top: 4px; font-size: 21px; font-weight: 700; color: #ffe9b8; }
  #shops b { color: var(--gold); font-weight: 900; }

  /* Sự kiện (mất điện, mưa) */
  #topStack { position: absolute; z-index: 20; top: 384px; left: 40px; right: 40px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  /* lời chủ trọ và thông báo nhỏ: góc dưới bên phải, chỗ đường trống, không che xóm trọ và không bị khung comment TikTok che */
  #bottomStack { position: absolute; z-index: 20; right: 26px; width: 640px; bottom: 328px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  #event { width: 100%; box-sizing: border-box; padding: 18px 26px 20px; border-radius: 26px;
    background: rgba(10, 8, 20, 0.88); border: 3px solid var(--gold); text-align: center; display: none; }
  #event.show { display: block; animation: pop .4s ease-out; }
  #event h2 { margin: 0; font-size: 46px; font-weight: 900; color: var(--gold); }
  #event p { margin: 6px 0 12px; font-size: 27px; font-weight: 700; }
  #event .bar { height: 26px; border-radius: 13px; background: rgba(255,255,255,.15); overflow: hidden; border: 2px solid rgba(255,255,255,.35); }
  #event .fill { height: 100%; width: 0%; background: linear-gradient(90deg, #ffb13b, #fff17a); transition: width .25s; }
  #event .num { margin-top: 6px; font-size: 22px; font-weight: 800; color: #ffe9a8; }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }

  /* Biển tên phòng & bong bóng */
  .plate { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; padding: 2px 9px 3px; border-radius: 9px;
    font-size: 17px; font-weight: 800; background: rgba(15, 20, 40, .82); border: 2px solid rgba(255,255,255,.25); }
  .plate .no { color: var(--gold); margin-right: 6px; }
  .plate.empty { font-size: 14px; color: #9fb0d8; font-weight: 700; background: rgba(15,20,40,.55); }
  body.compact .plate { font-size: 13px; padding: 1px 6px 2px; max-width: 108px; overflow: hidden; text-overflow: ellipsis; }
  body.compact .plate .no { margin-right: 3px; }
  .plate.small { font-size: 15px; padding: 1px 8px 2px; transform: translate(-50%, -100%); }
  .stall { position: absolute; transform: translate(-50%, 0); white-space: nowrap; padding: 5px 12px; border-radius: 12px;
    font-size: 18px; font-weight: 700; background: rgba(120, 20, 10, .85); border: 2px solid var(--gold); }
  .stall b { color: var(--gold); font-weight: 900; }
  .plate.vip { border-color: var(--gold); box-shadow: 0 0 14px rgba(255,215,106,.7); }
  .bubble { position: absolute; transform: translate(-50%, -100%); max-width: 300px; padding: 9px 14px; border-radius: 18px;
    background: #fffdf4; color: #1d1d2b; font-size: 22px; font-weight: 700; line-height: 1.25; box-shadow: 0 4px 14px rgba(0,0,0,.4);
    animation: pop .25s ease-out; }
  .bubble::after { content: ''; position: absolute; left: 50%; bottom: -10px; margin-left: -9px; border: 9px solid transparent; border-top-color: #fffdf4; border-bottom: 0; }
  .bubble .who { display: block; font-size: 16px; color: #8a5a00; font-weight: 800; }
  .float { position: absolute; transform: translate(-50%, -50%); font-size: 46px; animation: rise 2.2s ease-out forwards; }
  @keyframes rise { from { opacity: 1; margin-top: 0; } to { opacity: 0; margin-top: -120px; } }

  /* Bà chủ trọ nói */
  #landlady { width: 100%; display: none; }
  #landlady.show { display: block; animation: pop .3s ease-out; }
  #landlady .box { padding: 12px 18px; border-radius: 22px; background: #fff3d6; color: #3a2208; font-size: 23px; font-weight: 700; line-height: 1.3;
    border: 3px solid #e3a33a; box-shadow: 0 6px 20px rgba(0,0,0,.45); }
  #landlady .who { display: block; font-size: 19px; font-weight: 900; color: #b4500c; margin-bottom: 2px; }

  /* Thông báo quà */
  #banner { position: absolute; z-index: 20; left: 60px; right: 60px; top: 1010px; padding: 16px 22px; border-radius: 26px; text-align: center;
    background: linear-gradient(180deg, #d9482b, #7d1a0c); border: 4px solid var(--gold); display: none; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  #banner.show { display: block; animation: pop .35s ease-out; }
  #banner .a { font-size: 36px; font-weight: 900; }
  #banner .b { font-size: 27px; font-weight: 800; color: var(--gold); margin-top: 4px; }

  /* Thông báo nhỏ */
  #toasts { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .toast { padding: 7px 18px; border-radius: 999px; background: var(--card); border: 2px solid rgba(255,255,255,.2); font-size: 21px; font-weight: 700; animation: pop .3s ease-out; }

  /* Bảng xếp hạng (cột phải, tránh khung comment TikTok) */
  #board { position: absolute; z-index: 20; right: 26px; top: 1602px; width: 360px; padding: 14px 18px 12px; border-radius: 22px; background: var(--card); border: 2px solid var(--line); }
  #board h3 { margin: 0 0 6px; font-size: 22px; font-weight: 900; color: var(--gold); text-align: center; }
  #board .row { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 700; padding: 3px 0; }
  #board .row .n { width: 22px; color: var(--gold); font-weight: 900; }
  #board .row .r { color: #9fb0d8; font-size: 16px; width: 44px; }
  #board .row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #board .row .v { color: var(--gold); font-weight: 800; }
  #board .empty { color: #9fb0d8; font-size: 18px; text-align: center; padding: 4px 0 8px; }
  #board .sep { height: 1px; background: rgba(255,255,255,.15); margin: 8px 0; }

  #status { position: fixed; left: 8px; bottom: 6px; font: 13px system-ui, sans-serif; color: rgba(255,255,255,.45); display: none; }
  body.debug #status { display: block; }
  #batTieng { position: fixed; right: 12px; top: 12px; padding: 9px 14px; border: 0; border-radius: 10px; background: #ffd76a;
    color: #3a1a02; font: 700 14px 'Be Vietnam Pro', sans-serif; cursor: pointer; }
</style>
<script type="importmap">{ "imports": { "three": "/vendor/three/three.module.js" } }</script>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="1080" height="1920"></canvas>
  <div id="ui">
    <div id="head">
      <div id="title" class="shadow">XÓM TRỌ SINH VIÊN</div>
      <div><div id="hint">💬 <b>Comment</b> thuê phòng · ❤️ <b>Tim</b> nấu mì · 🎁 <b>Quà</b> đóng tiền điện</div></div>
      <div id="noodles" class="shadow">🍜 Cả xóm đã nấu <span id="noodleCount">0</span> gói mì · 🏠 <span id="tenantCount">0</span>/<span id="roomTotal">25</span> phòng có người</div>
      <div id="shops" class="shadow">🥖 Comment <b>"bánh mì"</b> hoặc <b>"xôi"</b> để mua · 🍵 <b>"trà đá"</b> để xuống quán ngồi</div>
    </div>
    <div id="labels"></div>
    <div id="banner"><div class="a"></div><div class="b"></div></div>
    <div id="topStack">
      <div id="event"><h2></h2><p></p><div class="bar"><div class="fill"></div></div><div class="num"></div></div>
    </div>
    <div id="bottomStack">
      <div id="toasts"></div>
      <div id="landlady"><div class="box"><span class="who">🧔 Chú chủ trọ</span><span class="say"></span></div></div>
    </div>
    <div id="board"></div>
  </div>
</div>
<div id="status"></div>
<button id="batTieng" hidden>🔊 Bật âm thanh</button>
<script type="module" src="game.js"></script>
</body>
</html>
